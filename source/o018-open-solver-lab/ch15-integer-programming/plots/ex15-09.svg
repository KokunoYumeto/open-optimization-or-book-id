<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" xml:lang="id-ID" aria-labelledby="title desc">
  <title id="title">Pewarnaan optimal graf lima simpul pada Latihan 15.9</title>
  <desc id="desc">Graf siklus lima dengan tali busur A–C. Simpul A dan D berwarna biru, B dan E jingga, serta C hijau. Segitiga A–B–C membuktikan bahwa tiga warna diperlukan.</desc>
  <metadata>{&quot;chromatic_number&quot;:3,&quot;coloring&quot;:{&quot;A&quot;:1,&quot;B&quot;:2,&quot;C&quot;:3,&quot;D&quot;:1,&quot;E&quot;:2},&quot;edges&quot;:[[&quot;A&quot;,&quot;B&quot;],[&quot;B&quot;,&quot;C&quot;],[&quot;C&quot;,&quot;D&quot;],[&quot;D&quot;,&quot;E&quot;],[&quot;E&quot;,&quot;A&quot;],[&quot;A&quot;,&quot;C&quot;]],&quot;exercise_id&quot;:&quot;15.9&quot;,&quot;language&quot;:&quot;id-ID&quot;}</metadata>
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Pewarnaan optimal: 3 warna</text>
  <text x="360" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">Segitiga A–B–C adalah sertifikat batas bawah.</text>
  <g stroke="#263238" stroke-width="5" stroke-linecap="round">
    <line x1="360" y1="135" x2="565" y2="260"/>
    <line x1="565" y1="260" x2="490" y2="430"/>
    <line x1="490" y1="430" x2="230" y2="430"/>
    <line x1="230" y1="430" x2="155" y2="260"/>
    <line x1="155" y1="260" x2="360" y2="135"/>
    <line x1="360" y1="135" x2="490" y2="430"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700">
    <circle cx="360" cy="135" r="37" fill="#0072B2" stroke="#111827" stroke-width="3"/>
    <text x="360" y="143" text-anchor="middle" font-size="25" fill="#ffffff">A</text>
    <circle cx="565" cy="260" r="37" fill="#E69F00" stroke="#111827" stroke-width="3"/>
    <text x="565" y="268" text-anchor="middle" font-size="25" fill="#ffffff">B</text>
    <circle cx="490" cy="430" r="37" fill="#009E73" stroke="#111827" stroke-width="3"/>
    <text x="490" y="438" text-anchor="middle" font-size="25" fill="#ffffff">C</text>
    <circle cx="230" cy="430" r="37" fill="#0072B2" stroke="#111827" stroke-width="3"/>
    <text x="230" y="438" text-anchor="middle" font-size="25" fill="#ffffff">D</text>
    <circle cx="155" cy="260" r="37" fill="#E69F00" stroke="#111827" stroke-width="3"/>
    <text x="155" y="268" text-anchor="middle" font-size="25" fill="#ffffff">E</text>
  </g>
  <g transform="translate(185 510)" font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <circle cx="0" cy="0" r="10" fill="#0072B2" stroke="#111827"/>
    <text x="17" y="5">Warna 1</text>
    <circle cx="135" cy="0" r="10" fill="#E69F00" stroke="#111827"/>
    <text x="152" y="5">Warna 2</text>
    <circle cx="270" cy="0" r="10" fill="#009E73" stroke="#111827"/>
    <text x="287" y="5">Warna 3</text>
  </g>
