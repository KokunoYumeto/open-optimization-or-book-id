<line class="tick" x1="376" y1="206.25" x2="384" y2="206.25"/>
<text class="tick-label y" x="370" y="210.25">1</text>
<text class="axis-label" x="694" y="341.5">x₁</text>
<text class="axis-label" x="50" y="162.5">x₂</text>
<text class="annotation-strong" x="473" y="189.2">x₂ = 1</text>
<text class="annotation-strong" x="434.25" y="269.8">x₂ = 0: seluruh garis optimal</text>
<text class="annotation" x="263.75" y="245">← arah linealitas (1,0) →</text>
