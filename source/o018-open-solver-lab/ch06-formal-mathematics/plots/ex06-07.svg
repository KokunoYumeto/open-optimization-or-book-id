  <title id="ex06-07-title">Latihan 6.7 — Setengah ruang x₁ + 2x₂ ≤ 4</title>
  <desc id="ex06-07-desc">Garis batas melalui (4,0) dan (0,2). Daerah layak berada pada sisi yang memuat titik asal. (2,1) berada pada batas, (1,2) di luar, dan titik tengah (1,1/2) berada di dalam. Tepi jendela bukan kendala model.</desc>
  <metadata>Adaptasi latihan O018 Bab 6; CC BY-SA 4.0.</metadata>
