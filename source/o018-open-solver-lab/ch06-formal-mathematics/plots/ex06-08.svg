<line class="tick" x1="450" y1="416" x2="450" y2="424"/>
<text class="tick-label" x="450" y="440">4</text>
<line class="tick" x1="520" y1="416" x2="520" y2="424"/>
<text class="tick-label" x="520" y="440">5</text>
<line class="tick" x1="590" y1="416" x2="590" y2="424"/>
<text class="tick-label" x="590" y="440">6</text>
<line class="tick" x1="166" y1="350" x2="174" y2="350"/>
<text class="tick-label y" x="160" y="354">1</text>
<line class="tick" x1="166" y1="280" x2="174" y2="280"/>
