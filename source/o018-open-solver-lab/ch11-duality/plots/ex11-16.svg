<title id="title">Daerah layak dual Latihan 11.16</title>
<desc id="desc">Daerah layak berada di kanan garis y1 sama dengan 4 dan di atas garis y2 sama dengan 2. Titik optimum adalah (4,2) dengan nilai tujuan 64.</desc>
