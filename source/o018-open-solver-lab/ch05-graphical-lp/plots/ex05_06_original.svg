<title id="title-ex05-6-original">Latihan 5.6: Daerah tak layak</title>
<desc id="desc-ex05-6-original">Tiga batas kendala tanpa irisan bersama. Dua pertidaksamaan selisih menjumlah menjadi kontradiksi 0&gt;=4, sehingga daerah layak kosong.</desc>
