<title id="title-ex05-16-minimum">Latihan 5.16: Minimum berhingga</title>
<desc id="desc-ex05-16-minimum">Daerah tak berbatas dengan titik ekstrem (0,6), (0,4), (1,2), dan (5,0). Minimum 2x+2y berada di (1,2), sedangkan maksimumnya tak berbatas pada dua sinar yang diberikan. Tampilan dipotong pada jendela x=[-1,12] dan y=[-1,12]; tepi jendela bukan kendala model.</desc>
