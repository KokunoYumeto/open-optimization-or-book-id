<title id="title-ex05-5-original">Latihan 5.5: Optimum jamak</title>
<desc id="desc-ex05-5-original">Daerah layak tak berbatas di atas dua garis. Seluruh ruas dari (10,3) sampai (15,0) optimal dengan nilai 45. Tampilan dipotong pada jendela x=[-2,22] dan y=[-2,22]; tepi jendela bukan kendala model.</desc>
