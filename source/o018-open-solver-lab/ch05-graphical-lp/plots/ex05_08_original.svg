<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title-ex05-8-original desc-ex05-8-original" xml:lang="id-ID" lang="id" focusable="false">
<title id="title-ex05-8-original">Latihan 5.8: Masalah tak berbatas</title>
<desc id="desc-ex05-8-original">Irisan dua setengah bidang tanpa batas tanda variabel. Sinar (3,0)+t(1,0) layak dan menurunkan -x+y tanpa batas. Tampilan dipotong pada jendela x=[-2,9] dan y=[-4,9]; tepi jendela bukan kendala model.</desc>
