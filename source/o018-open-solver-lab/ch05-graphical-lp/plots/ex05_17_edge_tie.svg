<title id="title-ex05-17-edge_tie">Latihan 5.17: Rusuk optimum</title>
<desc id="desc-ex05-17-edge_tie">Daerah layak Latihan 5.3. Objektif pertama x+y optimal di seluruh rusuk dari (0,4) sampai (3,1); setelah koefisien y diubah menjadi 2, optimum tunggal berpindah ke (0,4).</desc>
