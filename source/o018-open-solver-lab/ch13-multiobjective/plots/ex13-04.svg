<title id="title-13-4">Latihan 13.4 — batas Pareto desain</title>
<desc id="desc-13-4">Enam desain pada ruang tujuan. D, A, C, dan F membentuk batas Pareto; A berwarna jingga karena tidak pernah optimal untuk jumlah berbobot, sedangkan B dan E terdominasi.</desc>
