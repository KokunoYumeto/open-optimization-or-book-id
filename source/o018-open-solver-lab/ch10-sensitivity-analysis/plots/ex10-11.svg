  <title id="title-10-11">Latihan 10.11 — tekukan dan harga bayangan</title>
  <desc id="desc-10-11">Nilai optimal sama dengan b3 hingga b3 sama dengan 2, lalu tetap 2. Tekukan di 2 memiliki turunan kiri 1 dan turunan kanan 0.</desc>
